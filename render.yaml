services:
  - type: web
    name: rural-land-survey
    env: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rural-land-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LAND_DATA_PROVIDER
        value: mock
      - key: PORT
        value: 8000

databases:
  - name: rural-land-db
    databaseName: rural_land_survey
    user: rural_land_user
    plan: free